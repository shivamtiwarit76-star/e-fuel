<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>E.Fuel</title>
    <style>
        body {
            font-family: Arial;
            background: #1c1c1c;
            color: white;
            text-align: center;
        }

        .card {
            background: white;
            color: black;
            width: 300px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            padding: 10px;
            width: 100%;
            background: orange;
            border: none;
            color: white;
            cursor: pointer;
        }

        ul {
            text-align: left;
        }
    </style>
</head>
<body>

<h1>⛽ E.Fuel Advanced</h1>

<div class="card">

    <input type="text" id="name" placeholder="Apna Naam">
    <input type="number" id="litres" placeholder="Litres">

    <button onclick="calculate()">Calculate & Save</button>

    <h3 id="result"></h3>

    <h3>Booking History</h3>
    <ul id="history"></ul>

</div>

<script>
function calculate() {
    let name = document.getElementById("name").value;
    let litres = document.getElementById("litres").value;

    let price = litres * 100;

    document.getElementById("result").innerText =
        "Total Price: ₹ " + price;

    let data = JSON.parse(localStorage.getItem("fuel")) || [];

    data.push({name, litres, price});

    localStorage.setItem("fuel", JSON.stringify(data));

    showData();
}

function showData() {
    let list = document.getElementById("history");
    list.innerHTML = "";

    let data = JSON.parse(localStorage.getItem("fuel")) || [];

    data.forEach(item => {
        let li = document.createElement("li");
        li.innerText = item.name + " | " + item.litres + "L | ₹" + item.price;
        list.appendChild(li);
    });
}

showData();
</script>

</body>
</html>
