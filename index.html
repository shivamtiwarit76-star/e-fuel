<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>E-Fuel App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

.screen{
display:none;
height:100vh;
justify-content:center;
align-items:center;
flex-direction:column;
}

.active{display:flex;}

.card{
background:#1e293b;
padding:20px;
border-radius:12px;
width:90%;
max-width:320px;
}

input{
width:100%;
padding:10px;
margin:5px 0;
border-radius:6px;
border:none;
}

button{
width:100%;
padding:10px;
margin-top:8px;
border:none;
border-radius:6px;
background:#22c55e;
color:white;
cursor:pointer;
}
</style>
</head>

<body>
<body>

<div id="sendScreen">
    <h2>Send OTP</h2>
    <input type="text" id="phone" placeholder="Enter Mobile Number">
    <button onclick="sendOTP()">Send OTP</button>
</div>

<div id="verifyScreen" style="display:none;">
    <h2>Verify OTP</h2>
    <input type="text" id="otpInput" placeholder="Enter OTP">
    <button onclick="verifyOTP()">Verify OTP</button>
</div>

<script>
let generatedOTP = "";




<!-- PROFILE -->
<div id="profile" class="screen">
<div class="card">
<h3>Profile Setup</h3>
<input placeholder="Name">
<input placeholder="Email">
<button onclick="show('vehicle')">Next</button>
</div>
</div>

<!-- VEHICLE -->
<div id="vehicle" class="screen">
<div class="card">
<h3>Add Vehicle</h3>
<input placeholder="Vehicle Name">
<input placeholder="Number Plate">
<button onclick="show('location')">Next</button>
</div>
</div>

<!-- LOCATION -->
<div id="location" class="screen">
<div class="card">
<h3>Location Permission</h3>
<button onclick="getLocation()">Allow Location</button>
</div>
</div>

<script>

/* SCREEN CONTROL */
function show(id){
document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

/* LOCATION */
function getLocation(){
navigator.geolocation.getCurrentPosition(()=>{
alert("Location Saved ✅");
show('vehicle');
});
}

</script>

</body>
</html>
