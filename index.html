<body>

    <div class="header">
        <h1>⛽ E.Fuel</h1>
        <p>Smart Fuel Booking Platform</p>
        <p><strong>Created by Shivam Tiwari</strong></p>
    </div>

    <div class="card">
        <input type="text" id="name" placeholder="Apna Naam">

        <input type="number" id="litres" placeholder="Litres">

        <select id="fuelType">
            <option value="Petrol">Petrol</option>
            <option value="Diesel">Diesel</option>
            <option value="CNG">CNG</option>
        </select>

        <button onclick="calculate()">🚚 Book Fuel</button>

        <h3 id="result"></h3>

        <h3>Booking History</h3>
        <ul id="history"></ul>
    </div>

    <script>
        function calculate() {

            let name = document.getElementById("name").value;
            let litres = parseFloat(document.getElementById("litres").value);
            let fuelType = document.getElementById("fuelType").value;

            if (!name || !litres) {
                alert("Please fill all details.");
                return;
            }

            let pricePerLitre;

            if (fuelType === "Petrol") {
                pricePerLitre = 150;
            } else if (fuelType === "Diesel") {
                pricePerLitre = 120;
            } else {
                pricePerLitre = 105;
            }

            let price = litres * pricePerLitre;

            document.getElementById("result").innerText =
                "Total Price: ₹" + price;

            let data = JSON.parse(localStorage.getItem("fuel")) || [];

            data.push({
                name,
                litres,
                fuelType,
                price
            });

            localStorage.setItem("fuel", JSON.stringify(data));

            showData();
        }

        function showData() {

    let list = document.getElementById("history");
    list.innerHTML = "";

    let data = JSON.parse(localStorage.getItem("fuel")) || [];

    data.forEach((item, index) => {

        let li = document.createElement("li");

        li.innerHTML = `
            <b>${item.name}</b> | ${item.litres}L | ${item.fuelType} | ₹${item.price}
            <button onclick="deleteOrder(${index})">❌</button>
        `;

        list.appendChild(li);
    });
}

    let data = JSON.parse(localStorage.getItem("fuel")) || [];

    console.log("Before delete:", data);

    data.splice(index, 1);

    localStorage.setItem("fuel", JSON.stringify(data));

    console.log("After delete:", data);

    showData();
}

        list.appendChild(li);
    });

    showData();
}
}

    </script>
