```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E.Fuel</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0b1220;
color:white;
text-align:center;
}

#splash{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#000,#0033cc,#00cc66);
}

.logo{
font-size:42px;
font-weight:bold;
animation:pulse 1.5s infinite;
}

@keyframes pulse{
50%{transform:scale(1.1);}
}

.loader{
width:260px;
height:10px;
background:#222;
border-radius:20px;
overflow:hidden;
margin-top:20px;
}

.progress{
height:100%;
width:0%;
background:#00ff88;
animation:load 3s forwards;
}

@keyframes load{
to{width:100%;}
}

.card{
background:white;
color:black;
width:90%;
max-width:350px;
margin:30px auto;
padding:20px;
border-radius:12px;
box-sizing:border-box;
}

input,select,button{
width:100%;
padding:12px;
margin:8px 0;
box-sizing:border-box;
}

button{
background:#007bff;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
opacity:0.9;
}
</style>
</head>

<body>

<div id="splash">
<h1 class="logo">⛽ E.FUEL</h1>

<div class="loader">
<div class="progress"></div>
</div>

<p>Loading...</p>
</div>

<div id="loginScreen" style="display:none;">

<div class="card">

<h2>Login</h2>

<input type="text" id="phone" placeholder="Mobile Number">

<button onclick="sendOTP()">Send OTP</button>

</div>

</div>

<div id="otpScreen" style="display:none;">

<div class="card">

<h2>Verify OTP</h2>

<input type="text" id="otpInput" placeholder="Enter OTP">

<button onclick="verifyOTP()">Verify OTP</button>

</div>

</div>

<div id="dashboard" style="display:none;">

<div class="card">

<h2>⛽ E.Fuel Dashboard</h2>

<input type="text" id="name" placeholder="Apna Naam">

<input type="number" id="litres" placeholder="Litres">

<select id="fuelType">
<option>Petrol</option>
<option>Diesel</option>
<option>CNG</option>
</select>

<button onclick="calculate()">🚚 Book Fuel</button>

<h3 id="result"></h3>

</div>

</div>

<script>

setTimeout(function(){

document.getElementById("splash").style.display="none";

document.getElementById("loginScreen").style.display="block";

},3000);

function sendOTP(){

let phone=document.getElementById("phone").value;

if(phone.length<10){

alert("Valid Mobile Number Dalo");

return;

}

alert("Demo OTP Sent\n\nOTP = 123456");

document.getElementById("loginScreen").style.display="none";

document.getElementById("otpScreen").style.display="block";

}

function verifyOTP(){

let otp=document.getElementById("otpInput").value;

if(otp==="123456"){

document.getElementById("otpScreen").style.display="none";

document.getElementById("dashboard").style.display="block";

alert("Login Successful ✅");

}
else{

alert("Wrong OTP ❌");

}

}

function calculate(){

let litres=parseFloat(
document.getElementById("litres").value
);

let fuelType=
document.getElementById("fuelType").value;

if(!litres){

alert("Litres Enter Karo");

return;

}

let price;

if(fuelType==="Petrol"){

price=litres*150;

}
else if(fuelType==="Diesel"){

price=litres*120;

}
else{

price=litres*105;

}

document.getElementById("result").innerText=
"Total Price: ₹"+price;

}

</script>

</body>
</html>
