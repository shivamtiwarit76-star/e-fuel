<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E.FUEL</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0d1117;
    color:white;
    overflow:hidden;
}

/* Splash Screen */
#splash{
    position:fixed;
    width:100%;
    height:100vh;
    background:linear-gradient(135deg,#000000,#001f4d,#003366);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.logo{
    font-size:45px;
    font-weight:bold;
    color:#00ff88;
    text-shadow:0 0 20px #00ff88;
    animation:glow 1.5s infinite alternate;
}

@keyframes glow{
    from{
        text-shadow:0 0 10px #00ff88;
    }
    to{
        text-shadow:0 0 30px #00ff88,
                     0 0 50px #00ff88;
    }
}

.loading-container{
    width:220px;
    height:6px;
    background:#222;
    border-radius:10px;
    overflow:hidden;
    margin-top:30px;
}

.loading-bar{
    width:0%;
    height:100%;
    background:#00ff88;
    animation:loading 2s linear forwards;
}

@keyframes loading{
    from{
        width:0%;
    }
    to{
        width:100%;
    }
}

/* Login Screen */
#loginScreen{
    display:none;
    width:100%;
    height:100vh;
    padding:25px;
    background:#0d1117;
}

.brand{
    text-align:center;
    margin-top:60px;
    font-size:35px;
    font-weight:bold;
    color:#00ff88;
}

.subtitle{
    text-align:center;
    color:#ccc;
    margin-top:10px;
}

.input-box{
    width:100%;
    margin-top:60px;
}

input{
    width:100%;
    padding:16px;
    border:none;
    border-radius:15px;
    background:#161b22;
    color:white;
    font-size:16px;
}

button{
    width:100%;
    padding:16px;
    margin-top:20px;
    border:none;
    border-radius:15px;
    background:#00c853;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

#recaptcha-container{
    margin-top:20px;
}
</style>
</head>

<body>

<!-- Splash Screen -->
<div id="splash">
    <div class="logo">E.FUEL</div>

    <div class="loading-container">
        <div class="loading-bar"></div>
    </div>
</div>

<!-- Login Screen -->
<div id="loginScreen">

    <div class="brand">E.FUEL</div>

    <div class="subtitle">
        Fuel Delivery at Your Doorstep
    </div>

    <div class="input-box">

        <input
            type="tel"
            id="phoneNumber"
            placeholder="+91 9876543210"
        >

        <button onclick="sendOTP()">
            Send OTP
        </button>

        <div id="recaptcha-container"></div>

    </div>

</div></div>

<script>

setTimeout(()=>{

    document.getElementById("splash").style.display="none";

    document.getElementById("loginScreen").style.display="block";

    document.body.style.overflow="auto";

},2000);

</script>

</body>
</html>
