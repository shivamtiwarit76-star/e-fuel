<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>E-Fuel SaaS MVP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
}

.screen{
display:none;
height:100vh;
justify-content:center;
align-items:center;
flex-direction:column;
}

.active{display:flex;}

.card{
background:#111827;
padding:20px;
border-radius:12px;
width:90%;
max-width:350px;
text-align:center;
}

input{
width:90%;
padding:10px;
margin:8px 0;
border-radius:8px;
border:none;
}

button{
width:95%;
padding:12px;
background:#22c55e;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

.fuelBox{
background:#1f2937;
padding:15px;
margin:10px;
border-radius:10px;
cursor:pointer;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="screen active">
<div class="card">
<h2>E-Fuel Login</h2>
<input id="phone" placeholder="+91XXXXXXXXXX">
<div id="recaptcha"></div>
<button onclick="sendOTP()">Send OTP</button>
</div>
</div>

<!-- OTP -->
<div id="otp" class="screen">
<div class="card">
<h2>Verify OTP</h2>
<input id="code">
<button onclick="verifyOTP()">Verify</button>
</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="screen">
<h2>Select Fuel</h2>

<div class="fuelBox" onclick="selectFuel('Petrol')">Petrol ₹105</div>
<div class="fuelBox" onclick="selectFuel('Diesel')">Diesel ₹95</div>

<button onclick="placeOrder()">Place Order</button>
</div>

<!-- SUCCESS -->
<div id="success" class="screen">
<h2>Order Placed ✅</h2>
<p>Thank you for using E-Fuel</p>
</div>

<script>

const firebaseConfig = {
apiKey:"YOUR_KEY",
authDomain:"YOUR_DOMAIN",
projectId:"YOUR_ID"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let confirmation;
let selectedFuel = "";

/* OTP */
window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha');

function sendOTP(){
let phone=document.getElementById("phone").value;

auth.signInWithPhoneNumber(phone, window.recaptchaVerifier)
.then(res=>{
confirmation=res;
switchScreen("otp");
})
.catch(e=>alert(e.message));
}

function verifyOTP(){
confirmation.confirm(document.getElementById("code").value)
.then(()=>switchScreen("dashboard"))
.catch(()=>alert("Wrong OTP"));
}

/* FUEL */
function selectFuel(f){
selectedFuel=f;
alert(f+" selected");
}

/* ORDER */
function placeOrder(){
db.collection("orders").add({
fuel:selectedFuel,
time:Date.now()
});

switchScreen("success");
}

/* SCREEN */
function switchScreen(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

</script>

</body>
</html>
