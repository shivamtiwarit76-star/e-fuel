<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>E-Fuel App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: white;
}

.screen {
    display: none;
    height: 100vh;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}
.active { display: flex; }

#splash {
    background: linear-gradient(45deg,#22c55e,#0ea5e9);
    font-size: 35px;
    font-weight: bold;
}

.card {
    background: #1e293b;
    padding: 20px;
    border-radius: 12px;
    width: 90%;
    max-width: 320px;
}

input {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
    border-radius: 6px;
    border: none;
}

button {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    border: none;
    border-radius: 6px;
    background: #22c55e;
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash" class="screen active">⛽ E-FUEL</div>

<!-- ONBOARD -->
<div id="onboard" class="screen">
    <h2>Welcome</h2>
    <button onclick="show('login')">Start</button>
</div>

<!-- LOGIN -->
<div id="login" class="screen">
    <div class="card">
        <h3>OTP Login</h3>

        <input id="phone" placeholder="10 digit mobile number">
        <button onclick="sendOTP()">Send OTP</button>

        <input id="otp" placeholder="Enter OTP">
        <button onclick="verifyOTP()">Verify OTP</button>
    </div>
</div>

<!-- PROFILE -->
<div id="profile" class="screen">
    <div class="card">
        <h3>Profile Setup</h3>
        <input placeholder="Name">
        <input placeholder="Email">
        <button onclick="show('vehicle')">Next</button>
    </div>
</div>

<!-- VEHICLE -->
<div id="vehicle" class="screen">
    <div class="card">
        <h3>Add Vehicle</h3>
        <input placeholder="Vehicle Name">
        <input placeholder="Number Plate">
        <button onclick="show('location')">Next</button>
    </div>
</div>

<!-- LOCATION -->
<div id="location" class="screen">
    <div class="card">
        <h3>Location Permission</h3>
        <button onclick="getLocation()">Allow Location</button>
    </div>
</div>

<script>
/* SCREEN SWITCH */
function show(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

/* SPLASH AUTO MOVE */
setTimeout(()=>show('onboard'),2000);

/* MSG91 CONFIG */
const AUTH_KEY = "532531ARDDbXW56a31158eP1";
const TEMPLATE_ID = "6a311a02df1da373b006ed93";

/* SEND OTP */
function sendOTP(){

    let phone = document.getElementById("phone").value;

    if(phone.length !== 10){
        alert("Enter 10 digit number");
        return;
    }

    fetch("https://control.msg91.com/api/v5/otp", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "authkey": AUTH_KEY
        },
        body: JSON.stringify({
            template_id: TEMPLATE_ID,
            mobile: "91" + phone
        })
    })
    .then(res=>res.json())
    .then(data=>{
        console.log(data);
        alert("OTP Sent 📩");
    })
    .catch(err=>{
        console.log(err);
        alert("OTP Error");
    });
}

/* VERIFY OTP */
function verifyOTP(){

    let phone = document.getElementById("phone").value;
    let otp = document.getElementById("otp").value;

    fetch("https://control.msg91.com/api/v5/otp/verify", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "authkey": AUTH_KEY
        },
        body: JSON.stringify({
            mobile: "91"+phone,
            otp: otp
        })
    })
    .then(res=>res.json())
    .then(data=>{

        console.log(data);

        if(data.type==="success"){
            alert("Login Success ✅");
            show('profile');
        } else {
            alert("Wrong OTP ❌");
        }

    })
    .catch(err=>{
        console.log(err);
        alert("Verification error");
    });
}

/* LOCATION */
function getLocation(){
    navigator.geolocation.getCurrentPosition(()=>{
        alert("Location saved ✅");
        show('vehicle');
    });
}

</script>

</body>
</html>
