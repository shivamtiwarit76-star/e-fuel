<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>E-Fuel App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: white;
}

.screen {
    display: none;
    height: 100vh;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}
.active { display: flex; }

#splash {
    background: linear-gradient(45deg,#22c55e,#0ea5e9);
    font-size: 35px;
    font-weight: bold;
}

.card {
    background: #1e293b;
    padding: 20px;
    border-radius: 12px;
    width: 90%;
    max-width: 320px;
}

input {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
    border-radius: 6px;
    border: none;
}

button {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    border: none;
    border-radius: 6px;
    background: #22c55e;
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash" class="screen active">⛽ E-FUEL</div>

<!-- ONBOARD -->
<div id="onboard" class="screen">
    <h2>Welcome</h2>
    <button onclick="show('login')">Start</button>
</div>

<!-- LOGIN -->
<div id="login" class="screen">
    <div class="card">
        <h3>OTP Login</h3>

        <input id="phone" placeholder="Mobile Number (10 digit)">

        <!-- invisible captcha container -->
        <div id="recaptcha-container"></div>

        <button onclick="sendOTP()">Send OTP</button>

        <input id="otp" placeholder="Enter OTP">
        <button onclick="verifyOTP()">Verify OTP</button>
    </div>
</div>

<!-- PROFILE -->
<div id="profile" class="screen">
    <div class="card">
        <h3>Profile Setup</h3>
        <input placeholder="Name">
        <input placeholder="Email">
        <button onclick="show('vehicle')">Next</button>
    </div>
</div>

<!-- VEHICLE -->
<div id="vehicle" class="screen">
    <div class="card">
        <h3>Add Vehicle</h3>
        <input placeholder="Vehicle Name">
        <input placeholder="Number Plate">
        <button onclick="show('location')">Next</button>
    </div>
</div>

<!-- LOCATION -->
<div id="location" class="screen">
    <div class="card">
        <h3>Location Permission</h3>
        <button onclick="getLocation()">Allow Location</button>
    </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script>



// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAnUvEASVakh94YcokSkUmcKYYEdY5a1zs",
  authDomain: "efuel-app-10399.firebaseapp.com",
  databaseURL: "https://efuel-app-10399-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "efuel-app-10399",
  storageBucket: "efuel-app-10399.firebasestorage.app",
  messagingSenderId: "272330806335",
  appId: "1:272330806335:web:dfddcb70e1322f4b1f548a",
  measurementId: "G-XC0WCD6FZF"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

let recaptchaVerifier;
let confirmationResult;

/* SCREEN */
function show(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

setTimeout(()=>show('onboard'),2000);

/* INVISIBLE CAPTCHA */
window.addEventListener("load", function () {
    recaptchaVerifier = new firebase.auth.RecaptchaVerifier(
        'recaptcha-container',
        {
            size: 'invisible'
        }
    );
});

/* SEND OTP */
function sendOTP(){

    let number = document.getElementById("phone").value;

    if(number.length !== 10){
        alert("10 digit number enter karo");
        return;
    }

    let phone = "+91" + number; // AUTO +91

    auth.signInWithPhoneNumber(phone, recaptchaVerifier)
    .then((result)=>{
        confirmationResult = result;
        alert("OTP Sent 📩");
    })
    .catch((err)=>{
        alert(err.message);
        console.log(err);
    });
}

/* VERIFY OTP */
function verifyOTP(){

    let otp = document.getElementById("otp").value;

    confirmationResult.confirm(otp)
    .then(()=>{
        alert("Login Success ✅");
        show('profile');
    })
    .catch(()=>{
        alert("Wrong OTP ❌");
    });
}

/* LOCATION */
function getLocation(){
    navigator.geolocation.getCurrentPosition(()=>{
        alert("Location Saved ✅");
        show('vehicle');
    });
}

</script>

</body>
</html>
