<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E.FUEL Premium App</title>

<style>
body{
margin:0;
font-family:Arial;
background:#070b16;
color:white;
overflow:hidden;
}

.screen{display:none;padding:20px;}
.active{display:block;}

.center{
display:flex;
flex-direction:column;
justify-content:center;
height:100vh;
}

input,button{
width:100%;
padding:14px;
margin-top:12px;
border-radius:12px;
border:none;
font-size:16px;
}

input{
background:#1b2235;
color:white;
}

button{
background:#00d084;
color:white;
font-weight:bold;
cursor:pointer;
}

button:active{transform:scale(0.98);}

/* SPLASH */
#splash{
position:fixed;
width:100%;
height:100%;
background:linear-gradient(135deg,#000814,#001d3d,#003566);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
}

.logo{
font-size:55px;
font-weight:bold;
color:#00ffd5;
text-shadow:0 0 25px #00ffd5;
animation:logoAnim 1.5s infinite alternate;
}

@keyframes logoAnim{
from{transform:scale(0.95);opacity:0.6;}
to{transform:scale(1.05);opacity:1;}
}

.bar{
width:220px;
height:6px;
background:#222;
margin-top:25px;
border-radius:10px;
overflow:hidden;
}

.bar div{
width:0%;
height:100%;
background:#00ffd5;
animation:load 2s forwards;
}

@keyframes load{
to{width:100%;}
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
<div class="logo">E.FUEL</div>
<div class="bar"><div></div></div>
</div>

<!-- LOGIN -->
<div id="login" class="screen center">
<h2>Login</h2>
<input id="phone" placeholder="10 digit mobile number">
<div id="recaptcha-container"></div>
<button onclick="sendOTP()">Send OTP</button>
</div>

<!-- OTP -->
<div id="otpScreen" class="screen center">
<h2>OTP Verification</h2>
<input id="otp" placeholder="Enter OTP">
<button onclick="verifyOTP()">Verify OTP</button>
</div>

<!-- PROFILE -->
<div id="profile" class="screen center">
<h2>Profile Setup</h2>
<input id="name" placeholder="Full Name">
<input id="email" placeholder="Email">
<button onclick="saveProfile()">Continue</button>
</div>

<!-- VEHICLE -->
<div id="vehicle" class="screen center">
<h2>Add Vehicle</h2>
<input id="type" placeholder="Bike / Car">
<input id="plate" placeholder="Number Plate">
<button onclick="saveVehicle()">Next</button>
</div>

<!-- LOCATION -->
<div id="location" class="screen center">
<h2>Location Access</h2>
<button onclick="getLocation()">Allow Location</button>
<button onclick="manual()">Manual Entry</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getAuth,
RecaptchaVerifier,
signInWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_AUTH_DOMAIN",
projectId: "YOUR_PROJECT_ID",
appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let confirmationResult;

// SPLASH AUTO MOVE
setTimeout(()=>{
document.getElementById("splash").style.display="none";
document.getElementById("login").classList.add("active");
},2000);

// RECAPTCHA FIX
window.recaptchaVerifier = new RecaptchaVerifier(
'recaptcha-container',
{ size:'normal' },
auth
);

// SEND OTP
window.sendOTP = async function(){

let phone = document.getElementById("phone").value;

if(phone.length!==10){
alert("10 digit number daalo");
return;
}

phone = "+91"+phone;

try{
confirmationResult = await signInWithPhoneNumber(auth,phone,window.recaptchaVerifier);

document.getElementById("login").classList.remove("active");
document.getElementById("otpScreen").classList.add("active");

alert("OTP Sent");
}catch(e){
console.log(e);
alert("OTP Failed");
}
};

// VERIFY OTP
window.verifyOTP = async function(){

let otp = document.getElementById("otp").value;

try{
await confirmationResult.confirm(otp);

document.getElementById("otpScreen").classList.remove("active");
document.getElementById("profile").classList.add("active");

alert("Login Success");
}catch(e){
alert("Wrong OTP");
}
};

// PROFILE
window.saveProfile = function(){
document.getElementById("profile").classList.remove("active");
document.getElementById("vehicle").classList.add("active");
};

// VEHICLE
window.saveVehicle = function(){
document.getElementById("vehicle").classList.remove("active");
document.getElementById("location").classList.add("active");
};

// LOCATION
window.getLocation = function(){
navigator.geolocation.getCurrentPosition(()=>{
alert("Location Saved");
});
};

window.manual = function(){
alert("Manual location feature soon");
};

</script>

</body>
</html>
