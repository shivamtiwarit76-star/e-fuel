<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E.FUEL PRO</title>

<style>
body{
margin:0;
font-family:Arial;
background:#060914;
color:white;
overflow:hidden;
}

.screen{display:none;padding:20px;}
.active{display:block;}

.center{
display:flex;
flex-direction:column;
justify-content:center;
height:100vh;
}

input,button{
width:100%;
padding:14px;
margin-top:12px;
border-radius:12px;
border:none;
font-size:16px;
}

input{
background:#1a2236;
color:white;
}

button{
background:#00d084;
color:white;
font-weight:bold;
cursor:pointer;
}

button:active{transform:scale(0.98);}
button:disabled{opacity:0.5;}

/* SPLASH */
#splash{
position:fixed;
width:100%;
height:100%;
background:linear-gradient(135deg,#000814,#001d3d,#003566);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
}

.logo{
font-size:55px;
color:#00ffd5;
text-shadow:0 0 25px #00ffd5;
animation:logoAnim 1.5s infinite alternate;
}

@keyframes logoAnim{
from{transform:scale(0.95);opacity:0.6;}
to{transform:scale(1.05);opacity:1;}
}

.bar{
width:220px;height:6px;background:#222;margin-top:20px;border-radius:10px;overflow:hidden;
}

.bar div{
height:100%;
width:0%;
background:#00ffd5;
animation:load 2s forwards;
}

@keyframes load{
to{width:100%;}
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
<div class="logo">E.FUEL</div>
<div class="bar"><div></div></div>
</div>

<!-- LOGIN -->
<div id="login" class="screen center">
<h2>Login</h2>

<input id="phone" placeholder="10 digit mobile number">
<div id="recaptcha-container"></div>

<button id="otpBtn" onclick="sendOTP()">Send OTP</button>
</div>

<!-- OTP -->
<div id="otpScreen" class="screen center">
<h2>OTP Verify</h2>

<input id="otp" placeholder="Enter OTP">
<button onclick="verifyOTP()">Verify OTP</button>
</div>

<!-- PROFILE -->
<div id="profile" class="screen center">
<h2>Profile Setup</h2>

<input id="name" placeholder="Full Name">
<input id="email" placeholder="Email">
<button onclick="saveProfile()">Continue</button>
</div>

<!-- VEHICLE -->
<div id="vehicle" class="screen center">
<h2>Add Vehicle</h2>

<input id="type" placeholder="Bike / Car">
<input id="plate" placeholder="Number Plate">
<button onclick="saveVehicle()">Save Vehicle</button>
</div>

<!-- LOCATION -->
<div id="location" class="screen center">
<h2>Location Access</h2>

<button onclick="getLocation()">Allow Location</button>
<button onclick="manual()">Manual Entry</button>
</div>

<!-- HOME -->
<div id="home" class="screen center">
<h2>Welcome</h2>
<p id="userInfo"></p>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getAuth,
RecaptchaVerifier,
signInWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
doc,
setDoc,
getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_AUTH_DOMAIN",
projectId: "YOUR_PROJECT_ID",
appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let confirmationResult;
let userPhone;

/* SPLASH */
setTimeout(()=>show("login"),2000);

/* SCREEN SWITCH ENGINE */
function show(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* RECAPTCHA FIX */
window.recaptchaVerifier = new RecaptchaVerifier(
'recaptcha-container',
{ size:'normal' },
auth
);

/* ================= OTP SEND ================= */
window.sendOTP = async function(){

let phone = document.getElementById("phone").value;

if(!phone || phone.length!==10){
alert("10 digit number daalo");
return;
}

userPhone = "+91"+phone;

try{

document.getElementById("otpBtn").disabled = true;

confirmationResult = await signInWithPhoneNumber(
auth,
userPhone,
window.recaptchaVerifier
);

alert("OTP Sent");

show("otpScreen");

}catch(e){
console.log(e);
alert("OTP Failed");
document.getElementById("otpBtn").disabled = false;
}
};

/* ================= OTP VERIFY ================= */
window.verifyOTP = async function(){

let otp = document.getElementById("otp").value;

try{
await confirmationResult.confirm(otp);
show("profile");
}catch(e){
alert("Wrong OTP");
}
};

/* ================= PROFILE ================= */
window.saveProfile = async function(){

let name = document.getElementById("name").value;
let email = document.getElementById("email").value;

await setDoc(doc(db,"users",userPhone),{
name,email,phone:userPhone
});

show("vehicle");
};

/* ================= VEHICLE ================= */
window.saveVehicle = async function(){

let type = document.getElementById("type").value;
let plate = document.getElementById("plate").value;

await setDoc(doc(db,"vehicles",userPhone),{
type,plate
});

show("location");
};

/* ================= LOCATION ================= */
window.getLocation = function(){

navigator.geolocation.getCurrentPosition(()=>{
alert("Location Saved");
show("home");
});

};

window.manual = function(){
alert("Manual location coming soon");
show("home");
};

</script>

</body>
</html>
