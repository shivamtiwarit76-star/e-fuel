<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Fuel</title>

<style>
body{
    font-family:Arial;
    background:#1c1c1c;
    color:white;
    text-align:center;
    margin:0;
    padding:20px;
}
.header{
    background:linear-gradient(90deg,#0f2027,#203a43,#2c5364);
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}
.card{
    background:white;
    color:black;
    max-width:350px;
    margin:auto;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}
input,select,button{
    width:95%;
    padding:10px;
    margin:8px 0;
}
button{
    background:#007BFF;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
ul{text-align:left;}
</style>
</head>

<body>

<div class="header">
<h2>⛽ E-Fuel</h2>
<p>Smart Fuel Booking System</p>
</div>

<!-- LOGIN -->
<div class="card" id="authCard">
<h3>🔐 Login / Signup</h3>
<input id="loginName" placeholder="Username">
<input id="loginPass" type="password" placeholder="Password">
<button onclick="signup()">Signup</button>
<button onclick="login()">Login</button>
<button onclick="logout()">Logout</button>
</div>

<!-- BOOKING -->
<div class="card">
<input id="name" placeholder="Name">
<input id="litres" type="number" placeholder="Litres">

<select id="fuelType">
<option>Petrol</option>
<option>Diesel</option>
<option>CNG</option>
</select>

<button onclick="calculate()">🚚 Book Fuel</button>
<button onclick="getLocation()">📍 Get My Location</button>
<button onclick="payUPI()">💳 Pay via UPI</button>

<h3 id="result"></h3>
<p id="locationText"></p>
<p id="deliveryTime"></p>

<h3>📜 Booking History</h3>
<ul id="history"></ul>
</div>

<script>

let currentUser = null;

/* ---------- SIGNUP ---------- */
function signup(){
let u=document.getElementById("loginName").value;
let p=document.getElementById("loginPass").value;

if(!u||!p){alert("Fill all");return;}

let users=JSON.parse(localStorage.getItem("users"))||[];

if(users.find(x=>x.name===u)){
alert("User exists");return;
}

users.push({name:u,pass:p});
localStorage.setItem("users",JSON.stringify(users));

alert("Signup done");
}

/* ---------- LOGIN ---------- */
function login(){
let u=document.getElementById("loginName").value;
let p=document.getElementById("loginPass").value;

let users=JSON.parse(localStorage.getItem("users"))||[];

let user=users.find(x=>x.name===u&&x.pass===p);

if(!user){alert("Wrong login");return;}

currentUser=u;
document.getElementById("authCard").style.display="none";

alert("Welcome "+u);
}

/* ---------- LOGOUT ---------- */
function logout(){
currentUser=null;
document.getElementById("authCard").style.display="block";
alert("Logged out");
}

/* ---------- BOOK ---------- */
function calculate(){

if(!currentUser){
alert("Login first");
return;
}

let name=document.getElementById("name").value;
let litres=parseFloat(document.getElementById("litres").value);
let fuel=document.getElementById("fuelType").value;

if(!name||!litres){alert("Fill details");return;}

let price= fuel=="Petrol"?litres*150: fuel=="Diesel"?litres*120:litres*105;

document.getElementById("result").innerText="₹"+price;

let data=JSON.parse(localStorage.getItem("fuel"))||[];

data.push({user:currentUser,name,litres,fuel,price});

localStorage.setItem("fuel",JSON.stringify(data));

showData();

alert("Booked");
}

/* ---------- HISTORY ---------- */
function showData(){
let list=document.getElementById("history");
list.innerHTML="";

let data=JSON.parse(localStorage.getItem("fuel"))||[];

data.forEach(i=>{
let li=document.createElement("li");
li.innerText=i.user+" → "+i.name+" | "+i.litres+"L | "+i.fuel+" | ₹"+i.price;
list.appendChild(li);
});
}

/* ---------- LOCATION ---------- */
function getLocation(){

navigator.geolocation.getCurrentPosition(async pos=>{

let lat=pos.coords.latitude;
let lon=pos.coords.longitude;

document.getElementById("locationText").innerText=
"Lat: "+lat+" | Lon: "+lon;

try{
let res=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
let data=await res.json();

document.getElementById("locationText").innerText=
"📍 "+data.display_name;

}catch(e){}

document.getElementById("deliveryTime").innerText=
"ETA: 20-40 min";

});
}

/* ---------- UPI ---------- */
function payUPI(){

let litres=document.getElementById("litres").value;
let fuel=document.getElementById("fuelType").value;

if(!litres){alert("Enter litres");return;}

let price= fuel=="Petrol"?litres*150: fuel=="Diesel"?litres*120:litres*105;

let upi="upi://pay?pa=6202307387-n456@ybl&pn=E-Fuel&am="+price+"&cu=INR";

window.location.href=upi;
}

showData();

</script>

</body>
</html>
