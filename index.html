<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>E.FUEL</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ========================= -->
<!-- SPLASH SCREEN -->
<!-- ========================= -->

<section id="splashScreen" class="screen active">

<div class="logoBox">

<h1>E.FUEL</h1>

<p>Premium Fuel Delivery</p>

<div class="loader">
<div class="loaderFill"></div>
</div>

</div>

</section>

<!-- ========================= -->
<!-- LOGIN -->
<!-- ========================= -->

<section id="loginScreen" class="screen">

<div class="card">

<h2>Welcome</h2>

<p>Login with your Mobile Number</p>

<input
type="tel"
id="phone"
maxlength="10"
placeholder="Enter Mobile Number">

<button id="sendOtpBtn">

Send OTP

</button>

</div>

</section>

<!-- ========================= -->
<!-- OTP -->
<!-- ========================= -->

<section id="otpScreen" class="screen">

<div class="card">

<h2>Verify OTP</h2>

<p>Demo OTP : <b>123456</b></p>

<input
type="text"
id="otp"
maxlength="6"
placeholder="Enter OTP">

<button id="verifyOtpBtn">

Verify OTP

</button>

</div>

</section>

<!-- ========================= -->
<!-- PROFILE -->
<!-- ========================= -->

<section id="profileScreen" class="screen">

<div class="card">

<h2>Create Profile</h2>

<input
type="text"
id="fullName"
placeholder="Full Name">

<input
type="email"
id="email"
placeholder="Email Address">

<input
type="text"
id="referral"
placeholder="Referral Code (Optional)">

<select id="vehicleType">

<option value="">Select Vehicle</option>

<option value="Bike">Bike</option>

<option value="Car">Car</option>

<option value="Truck">Truck</option>

<option value="Bus">Bus</option>

</select>

<input
type="text"
id="vehicleNumber"
placeholder="Vehicle Number (BR01AB1234)">

<button id="saveProfileBtn">

Continue

</button>

</div>
  <!-- ========================= -->
<!-- LOCATION -->
<!-- ========================= -->

<section id="locationScreen" class="screen">

<div class="card">

<h2>Allow Location</h2>

<p>
We need your live location for fuel delivery.
</p>

<button id="allowLocationBtn">
📍 Use Current Location
</button>

<button id="manualLocationBtn">
Enter Address Manually
</button>

<p id="locationStatus"></p>

</div>

</section>

<!-- ========================= -->
<!-- DASHBOARD -->
<!-- ========================= -->

<section id="dashboardScreen" class="screen">

<div class="card">

<h2>Fuel Booking</h2>

<p id="currentLocation">
📍 Location Not Selected
</p>

<div class="fuelButtons">

<button id="petrolBtn">
⛽ Petrol ₹150/L
</button>

<button id="dieselBtn">
🚛 Diesel ₹120/L
</button>

</div>

<h3 id="selectedFuel">
Selected : Petrol
</h3>

<input
type="range"
id="fuelSlider"
min="1"
max="100"
value="5">

<p id="litreText">
5 Litres
</p>

<h2 id="totalPrice">
₹750
</h2>

<button id="deliveryBtn">
Proceed To Delivery
</button>

</div>

</section>

<script src="app.js"></script>

</body>
</html>

</section>
