<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E.FUEL STABLE</title>

<style>
body{
margin:0;
font-family:Arial;
background:#050914;
color:white;
overflow:hidden;
}

.screen{display:none;padding:20px;}
.active{display:block;}

.center{
display:flex;
flex-direction:column;
justify-content:center;
height:100vh;
}

input,button{
width:100%;
padding:14px;
margin-top:12px;
border-radius:12px;
border:none;
font-size:16px;
}

input{background:#1a2235;color:white;}

button{
background:#00d084;
color:white;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

button:active{transform:scale(0.98);}
button:disabled{opacity:0.5;}

#splash{
position:fixed;
width:100%;
height:100%;
background:linear-gradient(135deg,#000814,#001d3d,#003566);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
}

.logo{
font-size:55px;
color:#00ffd5;
text-shadow:0 0 25px #00ffd5;
animation:logo 1.5s infinite alternate;
}

@keyframes logo{
from{transform:scale(0.95);}
to{transform:scale(1.05);}
}

.bar{
width:220px;height:6px;background:#222;margin-top:20px;border-radius:10px;overflow:hidden;
}

.bar div{
height:100%;
width:0%;
background:#00ffd5;
animation:load 2s forwards;
}

@keyframes load{
to{width:100%;}
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
<div class="logo">E.FUEL</div>
<div class="bar"><div></div></div>
</div>

<!-- LOGIN -->
<div id="login" class="screen center">
<h2>Login</h2>

<input id="phone" placeholder="10 digit mobile">
<div id="recaptcha-container"></div>

<button id="sendBtn" onclick="sendOTP()">Send OTP</button>
</div>

<!-- OTP -->
<div id="otpScreen" class="screen center">
<h2>Verify OTP</h2>

<input id="otp" placeholder="Enter OTP">
<button onclick="verifyOTP()">Verify</button>
</div>

<!-- PROFILE -->
<div id="profile" class="screen center">
<h2>Profile</h2>

<input id="name" placeholder="Full Name">
<input id="email" placeholder="Email">
<button onclick="saveProfile()">Next</button>
</div>

<!-- VEHICLE -->
<div id="vehicle" class="screen center">
<h2>Vehicle</h2>

<input id="type" placeholder="Bike / Car">
<input id="plate" placeholder="Number Plate">
<button onclick="saveVehicle()">Next</button>
</div>

<!-- HOME -->
<div id="home" class="screen center">
<h2>Welcome</h2>
<p id="userInfo"></p>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getAuth,
RecaptchaVerifier,
signInWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
doc,
setDoc,
getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_AUTH_DOMAIN",
projectId: "YOUR_PROJECT_ID",
appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let confirmationResult;
let userPhone;

/* SCREEN SWITCH */
function show(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* SPLASH */
window.verifyOTP = async function(){

let otp = document.getElementById("otp").value;

if(!otp){
alert("OTP daalo");
return;
}

try{

if(!confirmationResult){
alert("OTP session expired. Dobara try karo");
return;
}

await confirmationResult.confirm(otp);

window.show("profile");

}catch(e){
console.log(e);
alert("OTP wrong ya expired");
}
};

/* ================= OTP SEND ================= */
window.sendOTP = async function(){

let phone = document.getElementById("phone").value;

if(!phone || phone.length!==10){
alert("10 digit number daalo");
return;
}

userPhone = "+91"+phone;

try{

document.getElementById("sendBtn").disabled = true;

confirmationResult = await signInWithPhoneNumber(
auth,
userPhone,
window.recaptchaVerifier
);

alert("OTP Sent");

show("otpScreen");

}catch(e){
console.log(e);
alert("OTP Failed");
document.getElementById("sendBtn").disabled = false;
}
};

/* ================= OTP VERIFY ================= */
window.verifyOTP = async function(){

let otp = document.getElementById("otp").value;

if(!otp){
alert("OTP daalo");
return;
}

try{

if(!confirmationResult){
alert("OTP session expired. Dobara try karo");
return;
}

await confirmationResult.confirm(otp);

window.show("profile");

}catch(e){
console.log(e);
alert("OTP wrong ya expired");
}
};

/* ================= PROFILE ================= */
window.saveProfile = async function(){

let name = document.getElementById("name").value;
let email = document.getElementById("email").value;

await setDoc(doc(db,"users",userPhone),{
name,email,phone:userPhone
});

show("vehicle");
};

/* ================= VEHICLE ================= */
window.saveVehicle = async function(){

let type = document.getElementById("type").value;
let plate = document.getElementById("plate").value;

await setDoc(doc(db,"vehicles",userPhone),{
type,plate
});

loadHome();
show("home");
};

/* ================= HOME ================= */
async function loadHome(){

let snap = await getDoc(doc(db,"users",userPhone));

document.getElementById("userInfo").innerText =
"Welcome " + snap.data().name + " | " + userPhone;
}
window.show = function(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
};
</script>

</body>
</html>
