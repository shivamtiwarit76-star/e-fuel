<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E.FUEL</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0b1220;
color:white;
}

.screen{
display:none;
height:100vh;
justify-content:center;
align-items:center;
flex-direction:column;
}

#splash{
display:flex;
background:linear-gradient(135deg,#000,#002b80,#00a651);
}

button{
padding:12px 20px;
border:none;
border-radius:8px;
background:#00a651;
color:white;
cursor:pointer;
}
</style>
</head>

<body>

<div id="splash" class="screen">
<h1>⛽ E.FUEL</h1>
<p>Loading...</p>
</div>

<div id="loginScreen" class="screen">
<h2>Login Screen</h2>
<button onclick="alert('Working ✅')">
Test Button
</button>
</div>

<script>
document.getElementById("splash").style.display="flex";

setTimeout(function(){

document.getElementById("splash").style.display="none";

document.getElementById("loginScreen").style.display="flex";

},2000);
</script>

</body>
</html>
