<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>E.Fuel Premium</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b1220;
color:white;
}

/* Splash */
#splash{
position:fixed;
width:100%;
height:100vh;
background:linear-gradient(135deg,#000,#001f3f,#00c853);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
}

.logo{
font-size:40px;
font-weight:bold;
animation:pulse 1.5s infinite;
}

@keyframes pulse{
50%{transform:scale(1.1);}
}

.loader{
width:250px;
height:8px;
background:#222;
border-radius:20px;
margin-top:20px;
overflow:hidden;
}

.loader span{
display:block;
height:100%;
width:0%;
background:#00ff88;
animation:load 3s linear forwards;
}

@keyframes load{
100%{width:100%;}
}

/* Login */
.screen{
display:none;
padding:20px;
}

.card{
background:white;
color:black;
max-width:350px;
margin:auto;
padding:20px;
border-radius:12px;
margin-top:40px;
}

input,select{
width:100%;
padding:12px;
margin:10px 0;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#007bff;
color:white;
margin-top:8px;
cursor:pointer;
}
</style>
</head>

<body>

<div id="splash">
<div class="logo">⛽ E.FUEL</div>
<div class="loader"><span></span></div>
</div>

<div id="loginScreen" class="screen">
<div class="card">
<h2>Send OTP</h2>

<input type="tel" id="phone"
placeholder="+91XXXXXXXXXX">

<div id="recaptcha-container"></div>

<button onclick="sendOTP()">
Send OTP
</button>
</div>
</div>

<div id="otpScreen" class="screen">
<div class="card">
<h2>Verify OTP</h2>

<input type="text" id="otp"
placeholder="Enter OTP">

<button onclick="verifyOTP()">
Verify OTP
</button>
</div>
</div>

<div id="appScreen" class="screen">
<div class="card">

<h2>⛽ E.Fuel</h2>

<input id="name" placeholder="Name">

<input id="litres"
type="number"
placeholder="Litres">

<select id="fuelType">
<option>Petrol</option>
<option>Diesel</option>
<option>CNG</option>
</select>

<button onclick="calculate()">
🚚 Book Fuel
</button>

<button onclick="getLocation()">
📍 Get Location
</button>

<p id="locationText"></p>
<p id="deliveryTime"></p>

<button onclick="payUPI()">
💳 Pay via UPI
</button>

<h3 id="result"></h3>
<p id="orderStatus"></p>

<ul id="history"></ul>

</div>
</div>
