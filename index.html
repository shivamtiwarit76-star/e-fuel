```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E.FUEL</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b1220;
}

/* Screens */

.screen{
display:none;
min-height:100vh;
justify-content:center;
align-items:center;
padding:20px;
}

/* Splash */

#splash{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:linear-gradient(135deg,#000,#002b80,#00a651);
color:white;
}

.logo{
font-size:52px;
font-weight:bold;
animation:pulse 1.5s infinite;
}

@keyframes pulse{
50%{
transform:scale(1.08);
}
}

.loader{
width:250px;
height:10px;
background:#222;
border-radius:50px;
overflow:hidden;
margin-top:20px;
}

.fill{
height:100%;
width:0%;
background:#00ff88;
animation:load 2s linear forwards;
}

@keyframes load{
to{
width:100%;
}
}

/* Card */

.card{
background:white;
width:100%;
max-width:380px;
padding:25px;
border-radius:18px;
text-align:center;
}

.card h2{
margin-bottom:15px;
}

input,select{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:8px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
background:#00a651;
color:white;
font-size:16px;
cursor:pointer;
}

.fuel-card{
padding:15px;
border-radius:10px;
margin:10px 0;
cursor:pointer;
font-weight:bold;
}

.petrol{
border:2px solid orange;
}

.diesel{
border:2px solid #0099ff;
}
</style>
</head>

<body>

<!-- SPLASH -->

<div id="splash">

<h1 class="logo">⛽ E.FUEL</h1>

<p>Smart Fuel Delivery</p>

<div class="loader">
<div class="fill"></div>
</div>

</div>

<!-- LOGIN -->

<div id="loginScreen" class="screen">

<div class="card">

<h2>E.FUEL Login</h2>

<input
type="tel"
id="phone"
maxlength="10"
placeholder="Enter Mobile Number">

<button onclick="sendOTP()">
Send OTP
</button>

</div>

</div>

<!-- OTP -->

<div id="otpScreen" class="screen">

<div class="card">

<h2>Verify OTP</h2>

<p>Demo OTP = 123456</p>

<input
type="number"
id="otp"
placeholder="Enter OTP">

<button onclick="verifyOTP()">
Verify OTP
</button>

</div>

</div>

<!-- PROFILE -->

<div id="profileScreen" class="screen">

<div class="card">

<h2>Complete Profile</h2>

<input type="text" id="fullname" placeholder="Full Name">

<input type="email" id="email" placeholder="Email">

<input type="text" id="referral" placeholder="Referral Code">

<select id="vehicleType">
<option>Bike</option>
<option>Car</option>
<option>Truck</option>
</select>

<input type="text" id="vehicleNumber" placeholder="Vehicle Number">

<button onclick="saveProfile()">
Continue
</button>

</div>

</div>

<!-- LOCATION -->

<div id="locationScreen" class="screen">

<div class="card">

<h2>📍 Location Access</h2>

<p>
We need your location to deliver fuel accurately.
</p>

<button onclick="allowLocation()">
Allow Location
</button>

<button onclick="manualLocation()">
Locate Manually
</button>

<p id="locationText"></p>

</div>

</div>

<!-- DASHBOARD -->

<div id="dashboard" class="screen">

<div class="card">

<h2>⛽ Fuel Booking</h2>

<p id="userLocation">
Current Location
</p>

<div
class="fuel-card petrol"
onclick="selectFuel('Petrol')">

⛽ Petrol

<br>

₹150/L

</div>

<div
class="fuel-card diesel"
onclick="selectFuel('Diesel')">

🚛 Diesel

<br>

₹120/L

</div>

<h3 id="selectedFuel">
Selected: Petrol
</h3>

<input
type="range"
id="fuelSlider"
min="1"
max="100"
value="5"
oninput="updateAmount()">

<p id="litreText">
5 Litres
</p>

<h2 id="totalAmount">
₹750
</h2>

<button onclick="proceedDelivery()">
Proceed To Delivery
</button>

</div>

</div>

<script>

let fuelPrice = 150;

/* Splash */

setTimeout(function(){

document.getElementById("splash").style.display="none";

document.getElementById("loginScreen").style.display="flex";

},2000);

/* OTP */

function sendOTP(){

let phone =
document.getElementById("phone").value;

if(phone.length !== 10){

alert("10 digit mobile number dalo");
return;

}

alert("Demo OTP Sent\nOTP = 123456");

document.getElementById("loginScreen").style.display="none";

document.getElementById("otpScreen").style.display="flex";

}

function verifyOTP(){

let otp =
document.getElementById("otp").value;

if(otp === "123456"){

document.getElementById("otpScreen").style.display="none";

document.getElementById("profileScreen").style.display="flex";

}
else{

alert("Wrong OTP");

}

}

/* Profile */

function saveProfile(){

let name =
document.getElementById("fullname").value;

if(!name){

alert("Full Name dalo");
return;

}

document.getElementById("profileScreen").style.display="none";

document.getElementById("locationScreen").style.display="flex";

}

/* Location */

function allowLocation(){

if(navigator.geolocation){

navigator.geolocation.getCurrentPosition(

function(){

document.getElementById("locationText").innerText =
"Location Connected ✅";

setTimeout(function(){

document.getElementById("locationScreen").style.display="none";

document.getElementById("dashboard").style.display="flex";

},1000);

}

);

}

}

function manualLocation(){

let area = prompt("Enter Your Area");

document.getElementById("userLocation").innerText =
"📍 " + area;

document.getElementById("locationScreen").style.display="none";

document.getElementById("dashboard").style.display="flex";

}

/* Dashboard */

function selectFuel(type){

if(type === "Petrol"){

fuelPrice = 150;

document.getElementById("selectedFuel").innerText =
"Selected: Petrol";

}
else{

fuelPrice = 120;

document.getElementById("selectedFuel").innerText =
"Selected: Diesel";

}

updateAmount();

}

function updateAmount(){

let litre =
document.getElementById("fuelSlider").value;

document.getElementById("litreText").innerText =
litre + " Litres";

document.getElementById("totalAmount").innerText =
"₹" + (litre * fuelPrice);

}

function proceedDelivery(){

alert("Part 3 me Delivery Scheduling add karenge 🚚");

}

updateAmount();

</script>

</body>
</html>
