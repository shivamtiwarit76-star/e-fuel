```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>E.FUEL</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7f9;
      color: #17202a;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      color: #22c55e;
    }

    main {
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      margin-bottom: 20px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    input, select, button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
    }

    button {
      background: #16a34a;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #15803d;
    }

    .fuel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .fuel button {
      background: #111827;
    }

    .fuel button.active {
      background: #16a34a;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }

    #app {
      display: none;
    }
  </style>
</head>

<body>

<header>
  <h1>E.FUEL</h1>
  <button id="logoutBtn" style="width:auto;padding:8px 15px;">
    Logout
  </button>
</header>

<main>

  <!-- LOGIN -->
  <section id="login" class="card">

    <h2>Login / Sign Up</h2>

    <input
      id="email"
      type="email"
      placeholder="Email address"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button id="signupBtn">
      Create Account
    </button>

    <button id="loginBtn">
      Login
    </button>

    <p id="message"></p>

  </section>


  <!-- APPLICATION -->
  <section id="app">

    <div class="card">

      <h2>Your Profile</h2>

      <input
        id="name"
        placeholder="Full name"
      >

      <input
        id="phone"
        placeholder="Phone number"
      >

      <input
        id="address"
        placeholder="Delivery address"
      >

      <button id="saveProfile">
        Save Profile
      </button>

    </div>


    <div class="card">

      <h2>Create Order</h2>

      <div class="fuel">

        <button id="petrolBtn">
          Petrol
        </button>

        <button id="dieselBtn">
          Diesel
        </button>

      </div>

      <input
        id="litres"
        type="number"
        min="1"
        step="1"
        placeholder="Quantity in litres"
      >

      <button id="createOrder">
        Create Order
      </button>

      <p id="orderMessage"></p>

    </div>


    <div class="card">

      <h2>My Orders</h2>

      <div id="orders">
        Loading...
      </div>

    </div>

  </section>

</main>


<script type="module">

import {
  auth,
  db
} from "./firebase-config.js";

import {
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
  doc,
  setDoc,
  getDoc,
  addDoc,
  collection,
  query,
  where,
  orderBy,
  getDocs,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const loginSection =
  document.getElementById("login");

const appSection =
  document.getElementById("app");

const message =
  document.getElementById("message");

let selectedFuel = "";


/* SIGN UP */

document
  .getElementById("signupBtn")
  .addEventListener("click", async () => {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if (!email || !password) {
      message.textContent =
        "Email and password required.";
      return;
    }

    try {

      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

      message.textContent =
        "Account created successfully.";

    } catch (error) {

      message.textContent =
        error.message;

    }

  });


/* LOGIN */

document
  .getElementById("loginBtn")
  .addEventListener("click", async () => {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    try {

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    } catch (error) {

      message.textContent =
        error.message;

    }

  });


/* LOGOUT */

document
  .getElementById("logoutBtn")
  .addEventListener("click", async () => {

    await signOut(auth);

  });


/* AUTH STATE */

onAuthStateChanged(auth, async (user) => {

  if (user) {

    loginSection.style.display = "none";
    appSection.style.display = "block";

    await loadProfile();
    await loadOrders();

  } else {

    loginSection.style.display = "block";
    appSection.style.display = "none";

  }

});


/* PROFILE */

async function loadProfile() {

  const user = auth.currentUser;

  const profileRef =
    doc(db, "users", user.uid);

  const profile =
    await getDoc(profileRef);

  if (profile.exists()) {

    const data = profile.data();

    document.getElementById("name").value =
      data.name || "";

    document.getElementById("phone").value =
      data.phone || "";

    document.getElementById("address").value =
      data.address || "";

  }

}


document
  .getElementById("saveProfile")
  .addEventListener("click", async () => {

    const user = auth.currentUser;

    await setDoc(
      doc(db, "users", user.uid),
      {
        name:
          document.getElementById("name").value,

        phone:
          document.getElementById("phone").value,

        address:
          document.getElementById("address").value,

        email:
          user.email,

        updatedAt:
          serverTimestamp()
      },
      { merge: true }
    );

    alert("Profile saved.");

  });


/* FUEL SELECTION */

document
  .getElementById("petrolBtn")
  .addEventListener("click", () => {

    selectedFuel = "Petrol";

    document
      .getElementById("petrolBtn")
      .classList.add("active");

    document
      .getElementById("dieselBtn")
      .classList.remove("active");

  });


document
  .getElementById("dieselBtn")
  .addEventListener("click", () => {

    selectedFuel = "Diesel";

    document
      .getElementById("dieselBtn")
      .classList.add("active");

    document
      .getElementById("petrolBtn")
      .classList.remove("active");

  });


/* CREATE ORDER */

document
  .getElementById("createOrder")
  .addEventListener("click", async () => {

    const user = auth.currentUser;

    const litres =
      Number(
        document.getElementById("litres").value
      );

    const address =
      document.getElementById("address").value.trim();

    if (!selectedFuel) {
      alert("Select a fuel type.");
      return;
    }

    if (!litres || litres <= 0) {
      alert("Enter a valid quantity.");
      return;
    }

    if (!address) {
      alert("Save your address first.");
      return;
    }

    try {

      await addDoc(
        collection(db, "orders"),
        {
          userId: user.uid,

          email: user.email,

          fuelType: selectedFuel,

          litres: litres,

          address: address,

          status: "Placed",

          createdAt:
            serverTimestamp()
        }
      );

      document.getElementById(
        "orderMessage"
      ).textContent =
        "Order created successfully.";

      document.getElementById(
        "litres"
      ).value = "";

      await loadOrders();

    } catch (error) {

      document.getElementById(
        "orderMessage"
      ).textContent =
        error.message;

    }

  });


/* ORDERS */

async function loadOrders() {

  const user = auth.currentUser;

  const ordersBox =
    document.getElementById("orders");

  ordersBox.innerHTML = "";

  try {

    const q = query(
      collection(db, "orders"),
      where("userId", "==", user.uid),
      orderBy("createdAt", "desc")
    );

    const snapshot =
      await getDocs(q);

    if (snapshot.empty) {

      ordersBox.textContent =
        "No orders yet.";

      return;

    }

    snapshot.forEach((item) => {

      const data = item.data();

      const div =
        document.createElement("div");

      div.style.padding = "15px";
      div.style.marginTop = "10px";
      div.style.border = "1px solid #ddd";
      div.style.borderRadius = "10px";

      div.innerHTML = `
        <strong>${data.fuelType}</strong><br>
        Quantity: ${data.litres} L<br>
        Status: <strong>${data.status}</strong>
      `;

      ordersBox.appendChild(div);

    });

  } catch (error) {

    ordersBox.textContent =
      "Orders could not be loaded.";

    console.error(error);

  }

}

</script>

</body>
</html>
