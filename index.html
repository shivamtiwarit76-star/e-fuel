<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Fuel Pro App</title>

<style>
body{
margin:0;
font-family:Arial;
transition:0.3s;
}

/* THEMES */
.dark{
background:#1c1c1c;
color:white;
}
.light{
background:#f2f2f2;
color:black;
}

/* HEADER */
.header{
padding:15px;
background:linear-gradient(90deg,#0f2027,#203a43,#2c5364);
color:white;
text-align:center;
}

/* CARD */
.card{
background:white;
color:black;
max-width:360px;
margin:10px auto;
padding:15px;
border-radius:10px;
}

/* INPUT */
input,select,button{
width:95%;
padding:10px;
margin:6px 0;
}

/* BUTTON */
button{
background:#007BFF;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

/* SIDE MENU */
#menu{
position:fixed;
top:0;
left:-250px;
width:220px;
height:100%;
background:#333;
color:white;
padding:10px;
transition:0.3s;
}

#menu button{
background:none;
border:1px solid white;
}

/* HIDDEN */
.hidden{display:none;}

ul{text-align:left;}
</style>
</head>

<body class="dark">

<div class="header">
<h2>⛽ E-Fuel App</h2>
<button onclick="toggleTheme()">🌗 Theme</button>
<button onclick="openMenu()">☰</button>
</div>

<!-- SIDE MENU -->
<div id="menu">
<h3>Menu</h3>
<button onclick="logout()">Logout</button>
<button onclick="closeMenu()">Close</button>
</div>

<!-- LOGIN -->
<div class="card" id="authCard">
<h3>🔐 Login / Signup</h3>

<input id="name" placeholder="Name">
<input id="email" placeholder="Email">
<input id="phone" placeholder="Phone">
<input id="pass" type="password" placeholder="Password">

<button onclick="signup()">Signup</button>
<button onclick="login()">Login</button>
</div>

<!-- BOOKING -->
<div class="card hidden" id="bookCard">

<input id="fuelName" placeholder="Name">
<input id="litres" type="number" placeholder="Litres">

<select id="fuelType">
<option>Petrol</option>
<option>Diesel</option>
<option>CNG</option>
</select>

<button onclick="bookFuel()">🚚 Book Fuel</button>
<button onclick="getLocation()">📍 Get Location</button>
<button onclick="payUPI()">💳 Pay via UPI</button>

<h3 id="result"></h3>
<p id="loc"></p>
<p id="eta"></p>

<h3>📜 History</h3>
<button onclick="clearHistory()">🗑 Delete History</button>
<ul id="history"></ul>
</div>

<script>

let currentUser=null;

/* THEME */
function toggleTheme(){
document.body.classList.toggle("light");
document.body.classList.toggle("dark");
}

/* MENU */
function openMenu(){
document.getElementById("menu").style.left="0";
}
function closeMenu(){
document.getElementById("menu").style.left="-250px";
}

/* SIGNUP */
function signup(){
let n=document.getElementById("name").value;
let e=document.getElementById("email").value;
let p=document.getElementById("phone").value;
let pass=document.getElementById("pass").value;

if(!n||!e||!p||!pass){
alert("Fill all fields");return;
}

let users=JSON.parse(localStorage.getItem("users"))||[];

users.push({n,e,p,pass});
localStorage.setItem("users",JSON.stringify(users));

alert("Signup success");
}

/* LOGIN */
function login(){
let n=document.getElementById("name").value;
let pass=document.getElementById("pass").value;

let users=JSON.parse(localStorage.getItem("users"))||[];

let user=users.find(u=>u.n===n&&u.pass===pass);

if(!user){
alert("Wrong login");
return;
}

currentUser=n;

document.getElementById("authCard").classList.add("hidden");
document.getElementById("bookCard").classList.remove("hidden");

alert("Welcome "+n);
}

/* LOGOUT */
function logout(){
currentUser=null;
document.getElementById("authCard").classList.remove("hidden");
document.getElementById("bookCard").classList.add("hidden");
closeMenu();
}

/* BOOK */
function bookFuel(){

if(!currentUser){alert("Login first");return;}

let name=document.getElementById("fuelName").value;
let litres=document.getElementById("litres").value;
let fuel=document.getElementById("fuelType").value;

if(!name||!litres){alert("Fill details");return;}

let price=fuel=="Petrol"?litres*150:fuel=="Diesel"?litres*120:litres*105;

document.getElementById("result").innerText="₹"+price;

let data=JSON.parse(localStorage.getItem("fuel"))||[];

data.push({user:currentUser,name,litres,fuel,price});

localStorage.setItem("fuel",JSON.stringify(data));

showHistory();

alert("Booked");
}

/* HISTORY */
function showHistory(){
let list=document.getElementById("history");
list.innerHTML="";

let data=JSON.parse(localStorage.getItem("fuel"))||[];

data.forEach(i=>{
let li=document.createElement("li");
li.innerText=i.user+" → "+i.name+" | "+i.litres+"L | "+i.fuel+" | ₹"+i.price;
list.appendChild(li);
});
}

/* DELETE HISTORY */
function clearHistory(){
localStorage.removeItem("fuel");
showHistory();
}

/* LOCATION */
function getLocation(){
navigator.geolocation.getCurrentPosition(async pos=>{

let lat=pos.coords.latitude;
let lon=pos.coords.longitude;

document.getElementById("loc").innerText="Lat:"+lat+" Lon:"+lon;

let res=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
let data=await res.json();

document.getElementById("loc").innerText=data.display_name;

/* ETA */
let dist=Math.sqrt(lat*lat+lon*lon);
let eta=dist<5?"10-20 min":"30-40 min";

document.getElementById("eta").innerText="ETA: "+eta;

});
}

/* UPI */
function payUPI(){

let litres=document.getElementById("litres").value;
let fuel=document.getElementById("fuelType").value;

if(!litres){alert("Enter litres");return;}

let price=fuel=="Petrol"?litres*150:fuel=="Diesel"?litres*120:litres*105;

let upi="upi://pay?pa=6202307387-n456@ybl&pn=E-Fuel&am="+price+"&cu=INR";

window.location.href=upi;
}

showHistory();

</script>

</body>
</html>
