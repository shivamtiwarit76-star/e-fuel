<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>E-Fuel Business MVP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#050816;
color:white;
}

.screen{
display:none;
height:100vh;
justify-content:center;
align-items:center;
flex-direction:column;
}

.active{display:flex;}

.card{
background:#111827;
padding:20px;
border-radius:15px;
width:90%;
max-width:360px;
text-align:center;
}

input{
width:90%;
padding:10px;
margin:8px 0;
border-radius:10px;
border:none;
}

button{
width:95%;
padding:12px;
border:none;
border-radius:10px;
background:#22c55e;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

.fuel{
display:flex;
gap:10px;
justify-content:center;
}

.fuelBox{
background:#1f2937;
padding:15px;
border-radius:10px;
cursor:pointer;
}

.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
justify-content:space-around;
background:#0f172a;
padding:10px;
font-size:12px;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="screen active">
<div class="card">
<h2>E-Fuel Login</h2>
<input id="phone" placeholder="+91XXXXXXXXXX">
<div id="recaptcha"></div>
<button onclick="sendOTP()">Send OTP</button>
</div>
</div>

<!-- OTP -->
<div id="otp" class="screen">
<div class="card">
<h2>Verify OTP</h2>
<input id="code">
<button onclick="verifyOTP()">Verify</button>
</div>
</div>

<!-- PROFILE -->
<div id="profile" class="screen">
<div class="card">
<h2>Profile Setup</h2>
<input id="name" placeholder="Full Name">
<input id="vehicle" placeholder="Vehicle Number">
<button onclick="saveProfile()">Continue</button>
</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="screen">
<h2>Select Fuel</h2>

<div class="fuel">
<div class="fuelBox" onclick="selectFuel('Petrol')">Petrol ₹105</div>
<div class="fuelBox" onclick="selectFuel('Diesel')">Diesel ₹95</div>
</div>

<button onclick="createOrder()">Place Order</button>
</div>

<!-- SUCCESS -->
<div id="success" class="screen">
<h2>Order Placed ✅</h2>
<p>Tracking Started</p>
<button onclick="home()">Home</button>
</div>

<!-- NAV -->
<div class="nav">
<div>Home</div>
<div>Orders</div>
<div>Wallet</div>
<div>Profile</div>
</div>

<script>

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_DOMAIN",
projectId: "YOUR_ID"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let confirmation;
let selectedFuel = "";
let userId = "";

/* OTP */
window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha');

function sendOTP(){
let phone = document.getElementById("phone").value;

auth.signInWithPhoneNumber(phone, window.recaptchaVerifier)
.then(res=>{
confirmation = res;
switchScreen("otp");
})
.catch(err=>alert(err.message));
}

function verifyOTP(){
confirmation.confirm(document.getElementById("code").value)
.then(result=>{
userId = result.user.uid;
switchScreen("profile");
})
.catch(()=>alert("Wrong OTP"));
}

/* PROFILE SAVE */
function saveProfile(){
db.collection("users").doc(userId).set({
name: document.getElementById("name").value,
vehicle: document.getElementById("vehicle").value
});

switchScreen("dashboard");
}

/* FUEL */
function selectFuel(f){
selectedFuel = f;
alert(f + " selected");
}

/* ORDER */
function createOrder(){

db.collection("orders").add({
userId,
fuel: selectedFuel,
status: "placed",
time: Date.now()
});

switchScreen("success");
}

/* NAV */
function home(){
switchScreen("dashboard");
}

function switchScreen(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

</script>

</body>
</html>
