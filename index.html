<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>E.Fuel</title>


    
    <style>
        body {
            font-family: Arial;
            background: #1c1c1c;
            color: white;
            text-align: center;
        }

        .card {
            background: white;
            color: black;
            width: 300px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            padding: 10px;
            width: 100%;
            background: orange;
            border: none;
            color: white;
            cursor: pointer;
        }

        ul {
            text-align: left;
        }
    </style>
</head>
<body> 
    <div style="background: linear-gradient(90deg, #0f2027, #203a43, #2c5364);
            color: white;
            text-align: center;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;">
    
    <h1>⛽ E.Fuel</h1>
    <p>Smart Fuel Booking Platform</p>
    <p><strong>Created by Shivam Tiwari</strong></p>

</div>
<h2 style="text-align: center;">
    E.Fuel - Created by Shivam Tiwari
</h2>
<h1>⛽ E.Fuel Advanced</h1>

<div class="card">

    <input type="text" id="name" placeholder="Apna Naam">
    <input type="number" id="litres" placeholder="Litres">
    <select id="fuelType">
    <option value="Petrol">Petrol</option>
    <option value="Diesel">Diesel</option>
    <option value="CNG">CNG</option>
</select>

    <button onclick="calculate()" style="background-color:#007BFF; color:white; border:none; padding:12px 20px; border-radius:10px; font-size:16px; cursor:pointer;">Calculate & Save</button>
<button onclick="getLocation()">📍 Get My Location</button>

<p id="locationText"></p>
    <h3 id="result"></h3>

    <h3>Booking History</h3>
    <ul id="history"></ul>

</div>

<script>
function calculate() {
    let name = document.getElementById("name").value;
    let litres = document.getElementById("litres").value;

    let fuelType = document.getElementById("fuelType").value;
let litres = parseFloat(document.getElementById("litres").value);
let pricePerLitre;

if (fuelType === "Petrol") {
    pricePerLitre = 150;  // Petrol ki price yahan change kar sakte ho
} else if (fuelType === "Diesel") {
    pricePerLitre = 120;   // Diesel ki price yahan change kar sakte ho
} else {
    pricePerLitre = 105;   // CNG ki price yahan change kar sakte ho
}

let price = litres * pricePerLitre;

    document.getElementById("result").innerText =
        "Total Price: ₹ " + price;

    let data = JSON.parse(localStorage.getItem("fuel")) || [];

    data.push({name, litres, price});

    localStorage.setItem("fuel", JSON.stringify(data));

    showData();
}

function showData() {
    let list = document.getElementById("history");
    list.innerHTML = "";

    let data = JSON.parse(localStorage.getItem("fuel")) || [];

    data.forEach(item => {
        let li = document.createElement("li");
        li.innerText = item.name + " | " + item.litres + "L | ₹" + item.price;
        list.appendChild(li);
    });
}

showData();
</script>

</body>
</html>
